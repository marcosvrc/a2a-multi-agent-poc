[project]
name = "planner-agent"
version = "0.1.0"
description = "Planner Agent (Google ADK) — orchestrates the multi-agent travel planning flow over A2A."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.28.1",
  "pydantic==2.10.3",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "google-adk==1.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
