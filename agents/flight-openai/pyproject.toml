[project]
name = "flight-agent"
version = "0.1.0"
description = "Flight Agent (OpenAI Agents SDK) — searches and ranks flights via MCP, exposed over A2A."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "pyjwt==2.10.1",
  "mcp==1.27.0",
  "openai-agents==0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
